<!DOCTYPE html>
<html id="html-tag" lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121214">
    <title>VN Subtitle Video Renderer</title>
    
    <link rel="stylesheet" href="./fonts.css">
    
    <style>
        :root {
            --primary: #8EB69B; 
            --accent-blue: #3b82f6;
            --bg-dark: #121214;
            --card-dark: #1e1e24;
            --card-border: #2a2a32;
            --text-main: #f1f5f9;
            --text-muted: #8b8b98;
            --danger: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            font-family: inherit; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'KurdForest', Tahoma, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .vn-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* 1. VN Top Navigation Bar */
        .vn-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--card-border);
        }

        .vn-header-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 6px;
        }

        .aspect-select {
            background: #1c1c22;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .export-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 2. Video Viewport Area */
        .preview-area {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            min-height: 240px;
            max-height: 420px;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            transition: aspect-ratio 0.2s ease;
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #sub-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Video Playback Controls */
        .playback-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background: #16161a;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .play-btn {
            background: var(--card-border);
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 3. VN Multi-track Timeline */
        .timeline-container {
            background: var(--bg-dark);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-row {
            background: var(--card-dark);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            cursor: pointer;
        }

        .track-icon {
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-row.active .track-label { color: var(--text-main); }
        .track-row input[type="file"] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }

        /* 4. Bottom Editing Toolbar (VN Style) */
        .vn-toolbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 6px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            background: #18181c;
            border-top: 1px solid var(--card-border);
        }

        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px;
        }
        .tool-item.active, .tool-item:hover { color: var(--primary); }

        /* Style Settings Panel */
        .style-panel {
            display: none;
            background: var(--card-dark);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px;
            flex-direction: column;
            gap: 10px;
        }

        .style-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .style-row label { font-size: 12px; font-weight: bold; color: var(--primary); }
        .style-row input[type="range"] { flex-grow: 1; accent-color: var(--primary); }

        /* Progress Modal (لەگەڵ دوگمەی هەڵوەشاندنەوە X) */
        .progress-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 12, 0.92);
            backdrop-filter: blur(8px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .progress-box {
            background: var(--card-dark);
            border: 1px solid var(--card-border);
            padding: 22px 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .cancel-render-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .progress-bar-outer {
            width: 100%;
            height: 10px;
            background: #2a2a32;
            border-radius: 999px;
            overflow: hidden;
            margin: 14px 0;
        }
        .progress-bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #34d399 0%, #059669 100%);
            transition: width 0.15s ease;
        }

        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast { background: rgba(22, 30, 26, 0.96); border: 1px solid var(--card-border); color: white; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="vn-container">
        <!-- 1. VN Top Navigation -->
        <div class="vn-header">
            <a href="./index.html" class="vn-header-btn" title="Back">
                <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </a>

            <select class="aspect-select" id="aspectSelect" onchange="changeAspectRatio(this.value)">
                <option value="16/9">16:9 (Original)</option>
                <option value="9/16">9:16 (Reels/TikTok)</option>
                <option value="1/1">1:1 (Square)</option>
                <option value="4/3">4:3 (Standard)</option>
            </select>

            <button class="export-btn" id="exportBtn" onclick="startExport()" disabled>
                <span>Export</span>
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>
        </div>

        <!-- 2. Video Preview Viewport -->
        <div class="preview-area">
            <div class="canvas-wrapper" id="canvasWrapper">
                <video id="main-video" playsinline preload="metadata"></video>
                <canvas id="sub-canvas"></canvas>
            </div>
        </div>

        <!-- Playback Bar -->
        <div class="playback-bar">
            <span id="currentTimeText">0:00</span>
            <button class="play-btn" onclick="togglePlayPause()" id="playPauseBtn">
                <svg style="width:16px;height:16px;" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <span id="durationTimeText">0:00</span>
        </div>

        <!-- 3. VN Track Timeline -->
        <div class="timeline-container">
            <div class="track-row" id="subTrackRow">
                <div class="track-icon">
                    <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                </div>
                <div class="track-label" id="subTrackLabel">Tap to add subtitle (SRT / ASS / VTT)</div>
                <input type="file" accept=".srt,.ass,.vtt" onchange="handleSubUpload(this)">
            </div>

            <div class="track-row" id="vidTrackRow">
                <div class="track-icon">
                    <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div class="track-label" id="vidTrackLabel">Tap to add video (MP4 / MKV / WEBM)</div>
                <input type="file" accept="video/mp4,video/webm,video/x-matroska,video/mkv,.mkv,.mp4,.webm" onchange="handleVideoUpload(this)">
            </div>
        </div>

        <!-- Style Settings Panel -->
        <div class="style-panel" id="stylePanel">
            <div class="style-row">
                <label>Font Size:</label>
                <input type="range" id="fontSizeRange" min="16" max="60" value="28" oninput="renderFrame()">
                <span id="fontSizeVal" style="font-size:12px; font-weight:bold; width:28px;">28</span>
            </div>
            <div class="style-row">
                <label>Position Offset:</label>
                <input type="range" id="subPosRange" min="4" max="45" value="12" oninput="renderFrame()">
                <span id="subPosVal" style="font-size:12px; font-weight:bold; width:28px;">12%</span>
            </div>
        </div>

        <!-- 4. VN Bottom Editing Toolbar -->
        <div class="vn-toolbar">
            <button class="tool-item" onclick="toggleStylePanel()">
                <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-23"></path></svg>
                <span>Style</span>
            </button>
            <button class="tool-item" onclick="document.querySelector('#vidTrackRow input').click()">
                <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Add Video</span>
            </button>
            <button class="tool-item" onclick="document.querySelector('#subTrackRow input').click()">
                <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h8M8 14h4m9-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Subtitle</span>
            </button>
            <button class="tool-item" onclick="resetProject()">
                <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span>Reset</span>
            </button>
        </div>
    </div>

    <!-- Progress Modal (دەستکاری کرا لەگەڵ دوگمەی هەڵوەشاندنەوە X) -->
    <div class="progress-overlay" id="progOverlay">
        <div class="progress-box">
            <button class="cancel-render-btn" onclick="cancelExport()" title="هەڵوەشاندنەوە">✕</button>
            <h3 style="margin:0 0 6px 0; color:var(--primary);">خەریکی ڕێندەرکردنە...</h3>
            <p style="font-size:12px; color:var(--text-muted); margin:0;">تکایە چاوەڕێ بکە، ئەم کرداری پێکەوەپەستانە لەسەر مۆبایلەکەت ئەنجام دەدرێت.</p>
            <div class="progress-bar-outer"><div class="progress-bar-inner" id="progInner"></div></div>
            <div id="progPercent" style="font-size:14px; font-weight:bold; color:var(--primary);">0%</div>
            <button class="btn btn-outline" style="margin-top:12px; padding:8px; font-size:12px; border-color:var(--danger); color:var(--danger);" onclick="cancelExport()">پاشگەزبوونەوە / هەڵوەشاندنەوە</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let parsedSubtitles = [];
        let isVideoLoaded = false;
        let isSubLoaded = false;
        let isRendering = false;
        let cancelRequested = false;

        const videoEl = document.getElementById('main-video');
        const canvas = document.getElementById('sub-canvas');
        const ctx = canvas.getContext('2d');

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function changeAspectRatio(val) {
            const wrapper = document.getElementById('canvasWrapper');
            const parts = val.split('/');
            wrapper.style.aspectRatio = `${parts[0]} / ${parts[1]}`;
            renderFrame();
        }

        function toggleStylePanel() {
            const panel = document.getElementById('stylePanel');
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }

        function handleVideoUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                videoEl.src = URL.createObjectURL(file);
                document.getElementById('vidTrackLabel').innerText = file.name;
                document.getElementById('vidTrackRow').classList.add('active');
                
                videoEl.onloadedmetadata = () => {
                    canvas.width = videoEl.videoWidth || 1280;
                    canvas.height = videoEl.videoHeight || 720;
                    document.getElementById('durationTimeText').innerText = formatTime(videoEl.duration);
                    isVideoLoaded = true;
                    checkReady();
                    renderFrame();
                };
            }
        }

        async function handleSubUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const text = await file.text();
                const isAss = file.name.toLowerCase().endsWith('.ass');
                const isVtt = file.name.toLowerCase().endsWith('.vtt');
                
                parsedSubtitles = isAss ? parseASS(text) : (isVtt ? parseVTT(text) : parseSRT(text));
                document.getElementById('subTrackLabel').innerText = file.name;
                document.getElementById('subTrackRow').classList.add('active');
                isSubLoaded = true;
                checkReady();
                renderFrame();
            }
        }

        function checkReady() {
            if(isVideoLoaded && isSubLoaded) {
                document.getElementById('exportBtn').disabled = false;
            }
        }

        function resetProject() {
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            parsedSubtitles = [];
            isVideoLoaded = false;
            isSubLoaded = false;
            document.getElementById('vidTrackLabel').innerText = 'Tap to add video (MP4 / MKV / WEBM)';
            document.getElementById('subTrackLabel').innerText = 'Tap to add subtitle (SRT / ASS / VTT)';
            document.getElementById('vidTrackRow').classList.remove('active');
            document.getElementById('subTrackRow').classList.remove('active');
            document.getElementById('exportBtn').disabled = true;
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }

        function togglePlayPause() {
            if(!isVideoLoaded) return;
            if(videoEl.paused) {
                videoEl.play();
                document.getElementById('playPauseBtn').innerHTML = `<svg style="width:16px;height:16px;" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            } else {
                videoEl.pause();
                document.getElementById('playPauseBtn').innerHTML = `<svg style="width:16px;height:16px;" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            }
        }

        function formatTime(sec) {
            if(!sec || isNaN(sec)) return '0:00';
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        function timeToSec(str) {
            if(!str) return 0;
            let p = str.replace(',', '.').trim().split(':');
            if(p.length === 3) return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
            if(p.length === 2) return parseFloat(p[0])*60 + parseFloat(p[1]);
            return parseFloat(p[0]) || 0;
        }

        function parseSRT(data) {
            let items = [];
            let blocks = data.replace(/\r\n/g, '\n').trim().split(/\n\s*\n/);
            blocks.forEach(b => {
                let lines = b.trim().split('\n');
                let tIdx = lines.findIndex(l => l.includes('-->'));
                if(tIdx !== -1) {
                    let times = lines[tIdx].split('-->');
                    items.push({
                        start: timeToSec(times[0]),
                        end: timeToSec(times[1]),
                        text: lines.slice(tIdx + 1).join('\n').replace(/<[^>]+>/g, '')
                    });
                }
            });
            return items;
        }

        function parseVTT(data) { return parseSRT(data.replace(/^WEBVTT/i, '')); }

        function parseASS(data) {
            let items = [];
            let lines = data.split(/\r?\n/);
            lines.forEach(l => {
                if(l.startsWith('Dialogue:')) {
                    let parts = l.split(',');
                    if(parts.length >= 10) {
                        let st = parts[1].trim(), en = parts[2].trim();
                        let raw = parts.slice(9).join(',');
                        let txt = raw.replace(/\{[^}]+\}/g, '').replace(/\\[Nn]/g, '\n').trim();
                        items.push({ start: timeToSec(st), end: timeToSec(en), text: txt });
                    }
                }
            });
            return items;
        }

        videoEl.addEventListener('timeupdate', () => {
            document.getElementById('currentTimeText').innerText = formatTime(videoEl.currentTime);
            renderFrame();
        });

        function renderFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(!isSubLoaded) return;

            const curTime = videoEl.currentTime;
            const currentSub = parsedSubtitles.find(s => curTime >= s.start && curTime <= s.end);

            const fontSize = parseInt(document.getElementById('fontSizeRange').value);
            const posPercent = parseInt(document.getElementById('subPosRange').value);
            document.getElementById('fontSizeVal').innerText = fontSize;
            document.getElementById('subPosVal').innerText = posPercent + '%';

            if(currentSub && currentSub.text) {
                const lines = currentSub.text.split('\n');
                const scale = canvas.width / 640; 
                const actualFontSize = fontSize * scale;
                
                ctx.font = `bold ${actualFontSize}px 'KurdForest', Tahoma, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.direction = 'rtl'; 

                const bottomY = canvas.height - (canvas.height * (posPercent / 100));
                const lineHeight = actualFontSize * 1.3;

                lines.reverse().forEach((line, idx) => {
                    const y = bottomY - (idx * lineHeight);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = actualFontSize * 0.22;
                    ctx.strokeText(line, canvas.width / 2, y);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(line, canvas.width / 2, y);
                });
            }
        }

        function cancelExport() {
            cancelRequested = true;
            document.getElementById('progOverlay').style.display = 'none';
            showToast("ڕێندەرەکە هەڵوەشێنرایەوە");
        }

        // ڕێندەرکردنی خێرا بە کوالێتی ئەسڵی ڤیدیۆکە
        async function startExport() {
            if(!isVideoLoaded || !isSubLoaded) return;

            cancelRequested = false;
            isRendering = true;
            const overlay = document.getElementById('progOverlay');
            const progInner = document.getElementById('progInner');
            const progPercent = document.getElementById('progPercent');
            overlay.style.display = 'flex';

            videoEl.pause();
            videoEl.currentTime = 0;

            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = videoEl.videoWidth || 1280;
            renderCanvas.height = videoEl.videoHeight || 720;
            const renderCtx = renderCanvas.getContext('2d');

            const stream = renderCanvas.captureStream(30);
            
            // پاراستنی کوالێتی بەرز (High Bitrate)
            const options = {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: Math.max(6000000, renderCanvas.width * renderCanvas.height * 3)
            };

            let recorder;
            try {
                recorder = new MediaRecorder(stream, options);
            } catch(e) {
                recorder = new MediaRecorder(stream);
            }

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                if(!cancelRequested) {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Rendered_Video.mp4';
                    a.click();
                    showToast("ڕێندەرەکە بە کوالێتی ئەسڵی تەواو بوو!");
                }
                overlay.style.display = 'none';
                isRendering = false;
            };

            recorder.start();
            
            const duration = videoEl.duration;
            const fps = 30;

            function processStep() {
                if(cancelRequested) {
                    recorder.stop();
                    return;
                }

                if(videoEl.currentTime >= duration || videoEl.ended) {
                    recorder.stop();
                    return;
                }

                renderCtx.drawImage(videoEl, 0, 0, renderCanvas.width, renderCanvas.height);
                
                const curTime = videoEl.currentTime;
                const currentSub = parsedSubtitles.find(s => curTime >= s.start && curTime <= s.end);
                
                if(currentSub && currentSub.text) {
                    const fontSize = parseInt(document.getElementById('fontSizeRange').value);
                    const posPercent = parseInt(document.getElementById('subPosRange').value);
                    const scale = renderCanvas.width / 640;
                    const actualFontSize = fontSize * scale;

                    renderCtx.font = `bold ${actualFontSize}px 'KurdForest', Tahoma, sans-serif`;
                    renderCtx.textAlign = 'center';
                    renderCtx.textBaseline = 'bottom';
                    renderCtx.direction = 'rtl';

                    const bottomY = renderCanvas.height - (renderCanvas.height * (posPercent / 100));
                    const lineHeight = actualFontSize * 1.3;
                    const lines = currentSub.text.split('\n');

                    lines.reverse().forEach((line, idx) => {
                        const y = bottomY - (idx * lineHeight);
                        renderCtx.strokeStyle = '#000000';
                        renderCtx.lineWidth = actualFontSize * 0.22;
                        renderCtx.strokeText(line, renderCanvas.width / 2, y);
                        renderCtx.fillStyle = '#FFFFFF';
                        renderCtx.fillText(line, renderCanvas.width / 2, y);
                    });
                }

                const pct = Math.min(100, Math.round((videoEl.currentTime / duration) * 100));
                progInner.style.width = pct + '%';
                progPercent.innerText = pct + '%';

                videoEl.currentTime += (1 / fps);
                setTimeout(processStep, 5);
            }

            videoEl.addEventListener('seeked', function onSeek() {
                videoEl.removeEventListener('seeked', onSeek);
                processStep();
            });
        }
    </script>
</body>
</html>
