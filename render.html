<!DOCTYPE html>
<html id="html-tag" lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8EB69B">
    <title data-i18n="renderTitle">ڕێندەری ڤیدیۆ و ژێرنووس</title>
    
    <link rel="stylesheet" href="./fonts.css">
    
    <style>
        :root {
            --primary: #8EB69B; 
            --primary-hover: #7ca188; 
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #0d120f; 
            --card-bg: rgba(20, 28, 23, 0.96); 
            --card-border: rgba(104, 211, 145, 0.2);
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8;
            --border-color: #223327; 
            --shadow-md: 0 8px 30px rgba(0,0,0,0.6); 
        }

        * { 
            box-sizing: border-box; 
            font-family: inherit; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'KurdForest', Tahoma, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* سەر دێڕی مۆدێرن */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-md);
        }

        .back-btn {
            background: rgba(142, 182, 155, 0.15);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:active { transform: scale(0.95); }

        /* شاشەی ڕێندەر و پێشبینینی VN */
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 14px;
            box-shadow: var(--shadow-md);
            margin-bottom: 14px;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--primary);
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #sub-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* دوگمەکانی هەڵبژاردنی فایل */
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .upload-box {
            position: relative;
            padding: 14px;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            background: rgba(26, 36, 31, 0.5);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-box:hover, .upload-box.has-file {
            border-color: var(--primary);
            background: rgba(52, 211, 153, 0.1);
        }
        .upload-box input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        .upload-box label { font-size: 12.5px; font-weight: bold; color: var(--primary); margin-top: 4px; pointer-events: none; }
        .upload-box .file-info { font-size: 11px; color: var(--text-muted); margin-top: 2px; word-break: break-all; pointer-events: none; }

        /* بەشی کۆنتڕۆڵ و ستایل کردنی VN */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: start;
        }
        .control-group label {
            font-size: 12.5px;
            font-weight: bold;
            color: var(--primary);
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-row input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* مۆداڵی پێشکەوتنی ڕێندەر */
        .progress-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 12, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .progress-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .progress-bar-outer {
            width: 100%;
            height: 10px;
            background: var(--border-color);
            border-radius: 999px;
            overflow: hidden;
            margin: 14px 0;
        }
        .progress-bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #34d399 0%, #059669 100%);
            transition: width 0.15s ease;
        }

        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast { background: rgba(22, 30, 26, 0.96); border: 1px solid var(--card-border); color: white; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="./index.html" class="back-btn">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span data-i18n="backBtn">گەڕانەوە</span>
            </a>
            <h3 style="margin:0; font-size:14px; color:var(--primary);" data-i18n="renderTitle">ڕێندەری VN بۆ ڤیدیۆ</h3>
            <div style="width:24px;"></div>
        </div>

        <div class="player-card">
            <div class="viewport-wrapper">
                <video id="main-video" playsinline preload="metadata"></video>
                <canvas id="sub-canvas"></canvas>
            </div>

            <div class="upload-grid">
                <div class="upload-box" id="vBox">
                    <svg style="width:24px;height:24px;color:var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <label data-i18n="selectVid">هەڵبژاردنی ڤیدیۆ</label>
                    <div class="file-info" id="vInfo">MP4 / WEBM</div>
                    <input type="file" id="vidInput" accept="video/*" onchange="handleVideoUpload(this)">
                </div>

                <div class="upload-box" id="sBox">
                    <svg style="width:24px;height:24px;color:var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                    <label data-i18n="selectSub">هەڵبژاردنی ژێرنووس</label>
                    <div class="file-info" id="sInfo">SRT / ASS / VTT</div>
                    <input type="file" id="subInput" accept=".srt,.ass,.vtt" onchange="handleSubUpload(this)">
                </div>
            </div>
        </div>

        <!-- بەشی دەستکاریکردنی شێوازی VN -->
        <div class="controls-card">
            <div class="control-group">
                <label data-i18n="fontSizeLbl">قەبارەی فۆنتی ژێرنووس:</label>
                <div class="control-row">
                    <input type="range" id="fontSizeRange" min="16" max="50" value="26" oninput="renderFrame()">
                    <span id="fontSizeVal" style="font-size:12px; font-weight:bold; min-width:25px;">26</span>
                </div>
            </div>

            <div class="control-group">
                <label data-i18n="posLbl">شوێنی بەرزوبنزمی ژێرنووس:</label>
                <div class="control-row">
                    <input type="range" id="subPosRange" min="5" max="40" value="12" oninput="renderFrame()">
                    <span id="subPosVal" style="font-size:12px; font-weight:bold; min-width:25px;">12%</span>
                </div>
            </div>

            <button class="btn" id="renderBtn" onclick="startExport()" disabled style="margin-top:10px;">
                <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span data-i18n="startRenderBtn">دەستپێکردنی ڕێندەر و داگرتن</span>
            </button>
        </div>
    </div>

    <!-- مۆداڵی دیاریکردنی ڕێژەی پێشکەوتنی ڕێندەر -->
    <div class="progress-overlay" id="progOverlay">
        <div class="progress-box">
            <h3 style="margin:0 0 8px 0; color:var(--primary);" data-i18n="renderingTitle">خەریکی ڕێندەرکردنە...</h3>
            <p style="font-size:12px; color:var(--text-muted); margin:0;" data-i18n="renderingDesc">تکایە چاوەڕێ بکە، ئەم کرداری پێکەوەپەستانە لەسەر مۆبایلەکەت ئەنجام دەدرێت.</p>
            <div class="progress-bar-outer"><div class="progress-bar-inner" id="progInner"></div></div>
            <div id="progPercent" style="font-size:14px; font-weight:bold; color:var(--primary);">0%</div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let parsedSubtitles = [];
        let isVideoLoaded = false;
        let isSubLoaded = false;

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function handleVideoUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const videoEl = document.getElementById('main-video');
                videoEl.src = URL.createObjectURL(file);
                document.getElementById('vInfo').innerText = file.name;
                document.getElementById('vBox').classList.add('has-file');
                
                videoEl.onloadedmetadata = () => {
                    const canvas = document.getElementById('sub-canvas');
                    canvas.width = videoEl.videoWidth || 1280;
                    canvas.height = videoEl.videoHeight || 720;
                    isVideoLoaded = true;
                    checkReady();
                    renderFrame();
                };
            }
        }

        async function handleSubUpload(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const text = await file.text();
                const isAss = file.name.toLowerCase().endsWith('.ass');
                const isVtt = file.name.toLowerCase().endsWith('.vtt');
                
                parsedSubtitles = isAss ? parseASS(text) : (isVtt ? parseVTT(text) : parseSRT(text));
                document.getElementById('sInfo').innerText = file.name;
                document.getElementById('sBox').classList.add('has-file');
                isSubLoaded = true;
                checkReady();
                renderFrame();
            }
        }

        function checkReady() {
            if(isVideoLoaded && isSubLoaded) {
                document.getElementById('renderBtn').disabled = false;
            }
        }

        function timeToSec(str) {
            if(!str) return 0;
            let p = str.replace(',', '.').trim().split(':');
            if(p.length === 3) return parseFloat(p[0])*3600 + parseFloat(p[1])*60 + parseFloat(p[2]);
            if(p.length === 2) return parseFloat(p[0])*60 + parseFloat(p[1]);
            return parseFloat(p[0]) || 0;
        }

        function parseSRT(data) {
            let items = [];
            let blocks = data.replace(/\r\n/g, '\n').trim().split(/\n\s*\n/);
            blocks.forEach(b => {
                let lines = b.trim().split('\n');
                let tIdx = lines.findIndex(l => l.includes('-->'));
                if(tIdx !== -1) {
                    let times = lines[tIdx].split('-->');
                    items.push({
                        start: timeToSec(times[0]),
                        end: timeToSec(times[1]),
                        text: lines.slice(tIdx + 1).join('\n').replace(/<[^>]+>/g, '')
                    });
                }
            });
            return items;
        }

        function parseVTT(data) {
            return parseSRT(data.replace(/^WEBVTT/i, ''));
        }

        function parseASS(data) {
            let items = [];
            let lines = data.split(/\r?\n/);
            lines.forEach(l => {
                if(l.startsWith('Dialogue:')) {
                    let parts = l.split(',');
                    if(parts.length >= 10) {
                        let st = parts[1].trim(), en = parts[2].trim();
                        let raw = parts.slice(9).join(',');
                        let txt = raw.replace(/\{[^}]+\}/g, '').replace(/\\[Nn]/g, '\n').trim();
                        items.push({ start: timeToSec(st), end: timeToSec(en), text: txt });
                    }
                }
            });
            return items;
        }

        const videoEl = document.getElementById('main-video');
        videoEl.addEventListener('timeupdate', renderFrame);

        function renderFrame() {
            const canvas = document.getElementById('sub-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(!isSubLoaded) return;

            const curTime = videoEl.currentTime;
            const currentSub = parsedSubtitles.find(s => curTime >= s.start && curTime <= s.end);

            const fontSize = parseInt(document.getElementById('fontSizeRange').value);
            const posPercent = parseInt(document.getElementById('subPosRange').value);
            document.getElementById('fontSizeVal').innerText = fontSize;
            document.getElementById('subPosVal').innerText = posPercent + '%';

            if(currentSub && currentSub.text) {
                const lines = currentSub.text.split('\n');
                const scale = canvas.width / 640; 
                const actualFontSize = fontSize * scale;
                
                ctx.font = `bold ${actualFontSize}px 'KurdForest', Tahoma, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                const bottomY = canvas.height - (canvas.height * (posPercent / 100));
                const lineHeight = actualFontSize * 1.3;

                lines.reverse().forEach((line, idx) => {
                    const y = bottomY - (idx * lineHeight);
                    
                    // شێوازی تۆخکردنی دەور (Outline)
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = actualFontSize * 0.2;
                    ctx.strokeText(line, canvas.width / 2, y);

                    // نووسینی سەراپایی دەقەکە
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(line, canvas.width / 2, y);
                });
            }
        }

        // ڕێندەرکردنی ڤیدیۆ و تێکەڵکردنی لەسەر مۆبایل بە خێرایی
        async function startExport() {
            if(!isVideoLoaded || !isSubLoaded) return;

            const overlay = document.getElementById('progOverlay');
            const progInner = document.getElementById('progInner');
            const progPercent = document.getElementById('progPercent');
            overlay.style.display = 'flex';

            videoEl.pause();
            videoEl.currentTime = 0;

            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = videoEl.videoWidth || 1280;
            renderCanvas.height = videoEl.videoHeight || 720;
            const ctx = renderCanvas.getContext('2d');

            const stream = renderCanvas.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch(e) {
                recorder = new MediaRecorder(stream);
            }

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Rendered_Video.mp4';
                a.click();
                overlay.style.display = 'none';
                showToast("ڕێندەرەکە بە سەرکەوتوویی تەواو بوو!");
            };

            recorder.start();
            
            const duration = videoEl.duration;
            const fps = 30;
            const interval = 1000 / fps;

            function processStep() {
                if(videoEl.currentTime >= duration || videoEl.ended) {
                    recorder.stop();
                    return;
                }

                ctx.drawImage(videoEl, 0, 0, renderCanvas.width, renderCanvas.height);
                
                // کێشانی ژێرنووس لەسەر فریمەکە
                const curTime = videoEl.currentTime;
                const currentSub = parsedSubtitles.find(s => curTime >= s.start && curTime <= s.end);
                
                if(currentSub && currentSub.text) {
                    const fontSize = parseInt(document.getElementById('fontSizeRange').value);
                    const posPercent = parseInt(document.getElementById('subPosRange').value);
                    const scale = renderCanvas.width / 640;
                    const actualFontSize = fontSize * scale;

                    ctx.font = `bold ${actualFontSize}px 'KurdForest', Tahoma, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';

                    const bottomY = renderCanvas.height - (renderCanvas.height * (posPercent / 100));
                    const lineHeight = actualFontSize * 1.3;
                    const lines = currentSub.text.split('\n');

                    lines.reverse().forEach((line, idx) => {
                        const y = bottomY - (idx * lineHeight);
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = actualFontSize * 0.2;
                        ctx.strokeText(line, renderCanvas.width / 2, y);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(line, renderCanvas.width / 2, y);
                    });
                }

                const pct = Math.min(100, Math.round((videoEl.currentTime / duration) * 100));
                progInner.style.width = pct + '%';
                progPercent.innerText = pct + '%';

                videoEl.currentTime += (1 / fps);
                setTimeout(processStep, 10);
            }

            videoEl.addEventListener('seeked', function onSeek() {
                videoEl.removeEventListener('seeked', onSeek);
                processStep();
            });
        }
    </script>
</body>
</html>
